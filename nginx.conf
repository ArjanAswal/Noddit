user nginx;
worker_processes 1;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  # Define a group of servers named "app" and use the default round-robin distribution algorithm

  upstream app {
    server 172.17.0.1:3001;
    server 172.17.0.1:3002;
  }

  server {
    listen 80;

    # CORS configuration
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';

    location = /favicon.ico {
      return 404;
    }

    location / {
      proxy_pass http://app;

      # Forward original headers
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Pass CORS headers from the backend
      proxy_pass_header Access-Control-Allow-Origin;
      proxy_pass_header Access-Control-Allow-Methods;
      proxy_pass_header Access-Control-Allow-Headers;
      proxy_pass_header Access-Control-Expose-Headers;
      proxy_pass_header Access-Control-Allow-Credentials;
    }
  }
}